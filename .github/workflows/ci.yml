name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore
        run: dotnet restore src/Sillet.Core/Sillet.Core.csproj
      - name: Unit tests (derivation, addresses, update signatures)
        run: dotnet run --project tests/Sillet.Tests -c Release
      - name: Build Windows app and CLI
        run: |
          dotnet build src/Sillet.App -c Release
          dotnet build src/Sillet.Cli -c Release

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Tests (keys, vault, signing, fees, approval warnings)
        run: npm test
      - name: Build for Chromium and Firefox
        run: npm run build
