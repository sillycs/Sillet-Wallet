name: Release

# The only way to publish Sillet. Push a tag like v1.1.5 and this workflow builds
# everything from that commit, attests it and creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Check the tag matches the code and the release key is set
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $code = (Select-String -Path src/Sillet.App/Services/UpdateService.cs -Pattern 'Version = "([0-9.]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$code") { throw "Tag $tag does not match the version in the code (v$code)" }
          $ext = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          if ($ext -ne $code) { throw "extension/package.json is $ext but the app is $code" }
          $key = (Select-String -Path src/Sillet.App/Services/UpdateKey.cs -Pattern 'PublicKeyHex = "([0-9a-f]*)"').Matches[0].Groups[1].Value
          if ($key.Length -ne 64) { throw "UpdateKey.PublicKeyHex is not set. Run keygen.ps1 and commit before releasing" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tagged commit is not on main" }

      - name: Tests
        run: dotnet run --project tests/Sillet.Tests -c Release

      - name: Windows app
        run: |
          dotnet build src/Sillet.App -c Release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/Sillet.App/bin/Release/net472/Sillet.exe dist/Sillet.exe

      - name: Windows command line
        run: |
          dotnet publish src/Sillet.Cli -c Release -f net8.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o cli-win
          Copy-Item cli-win/sillet-cli.exe dist/Sillet-CLI.exe

      - name: Linux app and command line
        run: |
          dotnet publish src/Sillet.Desktop -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o linux-app
          dotnet publish src/Sillet.Cli -c Release -f net8.0 -r linux-x64 --self-contained true -p:PublishSingleFile=true -o linux-cli
          New-Item -ItemType Directory -Force linux-stage/Sillet | Out-Null
          Copy-Item linux-app/Sillet.Desktop linux-stage/Sillet/Sillet
          Copy-Item linux-cli/sillet-cli linux-stage/Sillet/sillet-cli
          Copy-Item src/Sillet.App/Assets/silleticon.png linux-stage/Sillet/sillet.png
          Copy-Item linux/sillet.desktop, linux/uninstall.sh linux-stage/Sillet/
          Copy-Item linux/install-bin.sh linux-stage/Sillet/install.sh
          foreach ($f in "install.sh","uninstall.sh","sillet.desktop") {
            $path = "linux-stage/Sillet/$f"
            $t = [IO.File]::ReadAllText($path).Replace("`r`n","`n")
            [IO.File]::WriteAllText($path, $t, (New-Object Text.UTF8Encoding $false))
          }
          tar -czf dist/Sillet-Linux-x64.tar.gz -C linux-stage Sillet

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Browser extension (Chrome, Edge, Brave and Firefox)
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run build
          python -c "import shutil; shutil.make_archive('../dist/Sillet-Extension-Chromium', 'zip', 'dist/chromium'); shutil.make_archive('../dist/Sillet-Extension-Firefox', 'zip', 'dist/firefox')"
          python scripts/pack-source.py ../dist/Sillet-Extension-Source.zip

      - name: Android APK (stable signing key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ([string]::IsNullOrEmpty($env:KEYSTORE_B64)) {
            Write-Host "::warning::Android keystore secrets are missing, so this release has no APK"
            exit 0
          }
          [IO.File]::WriteAllBytes("$PWD/sillet.keystore", [Convert]::FromBase64String($env:KEYSTORE_B64))
          dotnet workload install android
          dotnet publish src/Sillet.Android -c Release -f net9.0-android -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$PWD/sillet.keystore" -p:AndroidSigningStorePass="env:KEYSTORE_PASSWORD" -p:AndroidSigningKeyAlias="$env:KEY_ALIAS" -p:AndroidSigningKeyPass="env:KEYSTORE_PASSWORD"
          Copy-Item (Get-ChildItem src/Sillet.Android/bin/Release/net9.0-android/publish/*-Signed.apk | Select-Object -First 1).FullName dist/Sillet.apk
          Remove-Item sillet.keystore

      - name: Checksums
        run: |
          cd dist
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File).FullName --title "Sillet ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
